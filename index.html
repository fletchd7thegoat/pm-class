<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dayton's Page</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
position:relative;
width:600px;
height:520px;
background:rgba(0,0,80,0.65);
border-radius:15px;
text-align:center;
padding-top:40px;
color:white;
box-shadow:0 0 25px rgba(0,0,0,0.4);
overflow:hidden;
}

.content{
position:relative;
z-index:2;
}

h1{
margin:0;
font-size:40px;
}

p{
font-size:20px;
margin-bottom:20px;
}

.links{
display:flex;
flex-direction:column;
align-items:center;
gap:12px;
}

.links a{
display:flex;
justify-content:center;
align-items:center;
width:240px;
padding:12px;
text-decoration:none;
color:white;
font-weight:bold;
border-radius:8px;
transition:0.25s;
}

.links a:hover{
transform:scale(1.05);
}

.youtube{background:#FF0000;}
.spotify{background:#1DB954;}
.amazon{background:#FF9900;}
.instagram{
background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
}

.seahorse{
background:linear-gradient(135deg,#00a651,#000000);
}

.gif{
background:linear-gradient(45deg,#000000,#ff4da6);
}

.cat{
position:absolute;
width:80px;
opacity:0.85;
z-index:1;
animation:spin 2s linear infinite;
pointer-events:none;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="container" id="box">

<img
src="https://media.tenor.com/2roX3uxz_68AAAAC/cat-spinning.gif"
class="cat"
id="cat"
alt="Spinning cat">

<div class="content">

<h1>Hello my name is Dayton</h1>
<p>Welcome to my page, enjoy all the content.</p>

<div class="links">

<a class="youtube" href="boxes.html">

</a>

<a class="spotify" href="Quotes.html" target="_blank">

</a>

<a class="amazon" href="text.html" target="_blank">
text.HTML
</a>

<a class="instagram" href="3 Gifs.html" target="_blank">

</a>

<a class="seahorse" href="seahorse.HTML" target="_blank">
seahorse.HTML
</a>

<a class="gif" href="gif.html" target="_blank">
gif.HTML
</a>


</div>

</div>

</div>

<script>
document.addEventListener("DOMContentLoaded",function(){

const cat=document.getElementById("cat");
const box=document.getElementById("box");

let x=50;
let y=50;
let dx=2;
let dy=2;

function moveCat(){

const boxWidth=box.clientWidth;
const boxHeight=box.clientHeight;
const catSize=80;

x+=dx;
y+=dy;

if(x<=0 || x+catSize>=boxWidth){dx*=-1;}
if(y<=0 || y+catSize>=boxHeight){dy*=-1;}

cat.style.left=x+"px";
cat.style.top=y+"px";

requestAnimationFrame(moveCat);
}

moveCat();

});
</script>

</body>
</html>
