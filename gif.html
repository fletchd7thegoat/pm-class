<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GIF / Video Preview</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(-45deg, #1a1a1a, #2b1d16, #3a3a3a, #1f1612);
  background-size: 400% 400%;
  animation: swirl 12s ease infinite;
}

@keyframes swirl {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.player {
  width: 33vw;
  height: 60vh;
  background: rgba(0,0,0,0.4);
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

video {
  width: 100%;
  height: 85%;
  border-radius: 12px;
  transition: transform 0.2s ease;
}


.controls {
  width: 100%;
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}

button, select, input[type=range] {
  padding: 5px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button {
  background: #333;
  color: white;
}

button:hover {
  background: #555;
}

input[type=range] {
  width: 100%;
}


.zoomed {
  transform: scale(1.5);
}
</style>
</head>

<body>

<div class="player">
  <video id="video" src="animationawesome.mp4"></video>

  <input type="range" id="seek" value="0" min="0" max="100">

  <div class="controls">
    <button onclick="togglePlay()">▶ / ⏸</button>
    <button onclick="skip(-15)">-15s</button>
    <button onclick="skip(15)">+15s</button>

    <button onclick="toggleMute()">🔊 / 🔇</button>

    <button onclick="zoomIn()">Zoom +</button>
    <button onclick="zoomOut()">Zoom -</button>

    <button onclick="popOut()">Pop-out</button>

    <select onchange="setSpeed(this.value)">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
  </div>
</div>

<script>
const video = document.getElementById("video");
const seek = document.getElementById("seek");

let zoomLevel = 1;


function togglePlay() {
  if (video.paused) video.play();
  else video.pause();
}


video.addEventListener("timeupdate", () => {
  seek.value = (video.currentTime / video.duration) * 100;
});

seek.addEventListener("input", () => {
  video.currentTime = (seek.value / 100) * video.duration;
});


function skip(seconds) {
  video.currentTime += seconds;
}


function toggleMute() {
  video.muted = !video.muted;
}


function setSpeed(val) {
  video.playbackRate = val;
}


function zoomIn() {
  zoomLevel += 0.2;
  video.style.transform = `scale(${zoomLevel})`;
}

function zoomOut() {
  zoomLevel = Math.max(1, zoomLevel - 0.2);
  video.style.transform = `scale(${zoomLevel})`;
}


function popOut() {
  const win = window.open("", "Video", "width=800,height=500");
  win.document.write(`
    <video src="${video.src}" controls autoplay style="width:100%;height:100%;background:black;"></video>
  `);
}
</script>

</body>
</html>
