<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 Gifs</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #5b0000;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
    }

    h1 {
      margin-top: 20px;
      font-size: 40px;
    }

    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
      margin-top: 40px;
    }

    .box {
      background-color: black;
      border: 4px solid gold;
      border-radius: 20px;
      padding: 20px;
      width: 350px;
      transition: transform 0.2s ease;
    }

    .box:hover {
      transform: scale(1.03);
    }

    .title {
      font-size: 22px;
      margin-bottom: 15px;
      font-style: italic;
    }

    .gif {
      width: 100%;
      border-radius: 10px;
    }

    .bottom {
      margin-top: 40px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>

<body>

  <h1>My Memes</h1>

  <div class="container">
    
    <!-- Gif 1 -->
    <div class="box">
      <div class="title">Gif 1</div>
      <a href="gif-tuu.gif" target="_blank">
        <img src="gif-tuu.gif" class="gif">
      </a>
    </div>

    <!-- Gif 2 -->
    <div class="box">
      <div class="title">Gif 2</div>
      <a href="gif-number-won.gif" target="_blank">
        <img src="gif-number-won.gif" class="gif">
      </a>
    </div>

  </div>

  <div class="bottom">
    
    <!-- Gif 3 -->
    <div class="box">
      <div class="title">Gif 3</div>
      <a href="gif-3.gif" target="_blank">
        <img src="gif-3.gif" class="gif">
      </a>
    </div>

  </div>

</body>
</html>
