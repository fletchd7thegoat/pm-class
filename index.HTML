<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dayton's Page</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4facfe,#00f2fe);
}

/* Blue container */
.container{
position:relative;
width:600px;
height:360px;
background:rgba(0,0,80,0.65);
border-radius:15px;
text-align:center;
padding-top:40px;
color:white;
box-shadow:0 0 25px rgba(0,0,0,0.4);
overflow:hidden;
}

/* Text content */
.content{
position:relative;
z-index:2;
}

h1{
margin:0;
font-size:40px;
}

p{
font-size:20px;
margin-bottom:20px;
}

/* Link stack */
.links{
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
}

/* Base button style */
.links a{
display:flex;
align-items:center;
gap:10px;
width:220px;
padding:10px;
text-decoration:none;
color:white;
font-weight:bold;
border-radius:8px;
transition:0.2s;
}

.links a:hover{
transform:scale(1.05);
}

/* Brand colors */
.youtube{background:#FF0000;}
.spotify{background:#1DB954;}
.amazon{background:#FF9900;}
.instagram{
background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
}

/* Logo images inside links */
.links a img{
width:24px;
height:24px;
}

/* Cat animation */
.cat{
position:absolute;
width:80px;
opacity:0.85;
z-index:1;
animation:spin 2s linear infinite;
pointer-events:none;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div class="container" id="box">

<img
src="https://media.tenor.com/2roX3uxz_68AAAAC/cat-spinning.gif"
class="cat"
id="cat"
alt="Spinning cat">

<div class="content">

<h1>Hello my name is Dayton</h1>
<p>Welcome to my page, enjoy all the content.</p>

<div class="links">
<a class="youtube" href="boxes.html">
<img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube logo">
Boxes
</a>

<a class="spotify" href="Quotes.html" target="_blank">
<img src="https://upload.wikimedia.org/wikipedia/commons/2/26/Spotify_logo_with_text.svg" alt="Spotify logo">
Quotes
</a>

<a class="amazon" href="text.html" target="_blank">
<img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon logo">
text.html
</a>

<a class="instagram" href="https://instagram.com" target="_blank">
<img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram logo">
Placeholder
</a>

</div>

</div>

</div>

<script>

document.addEventListener("DOMContentLoaded",function(){

const cat=document.getElementById("cat");
const box=document.getElementById("box");

let x=50;
let y=50;
let dx=2;
let dy=2;

function moveCat(){

const boxWidth=box.clientWidth;
const boxHeight=box.clientHeight;
const catSize=80;

x+=dx;
y+=dy;

if(x<=0 || x+catSize>=boxWidth){dx*=-1;}
if(y<=0 || y+catSize>=boxHeight){dy*=-1;}

cat.style.left=x+"px";
cat.style.top=y+"px";

requestAnimationFrame(moveCat);
}

moveCat();

});

</script>

</body>
</html>
